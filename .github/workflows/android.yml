name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull down your project files from the repository
      - uses: actions/checkout@v4

      # 2. Set up the Java environment needed for Android
      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. Create the missing gradlew files online
      - name: Generate Gradle Wrapper
        run: gradle wrapper

      # 4. Fix any "Permission Denied" issues for the runner
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4.5. Generate the missing debug keystore file automatically
      - name: Create Debug Keystore
        run: keytool -genkey -v -keystore debug.keystore -keyalgorithm RSA -keysize 2048 -validity 10000 -alias androiddebugkey -keypass android -storepass android -dname "CN=Android Debug,O=Android,C=US" -noprompt
      # 5. Compile the app into a debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. Save the finished APK so you can click and download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
